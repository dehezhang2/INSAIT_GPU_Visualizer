<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPU Visualizer — login</title>
<style>
  :root{--bg:#0e1116;--panel:#161b22;--panel2:#1c2230;--line:#2a3242;
    --text:#d7dde7;--muted:#8b95a7;--accent:#4f9cf9;--bad:#e0556b}
  *{box-sizing:border-box}
  body{margin:0;height:100vh;display:flex;align-items:center;justify-content:center;
    background:var(--bg);color:var(--text);
    font:14px/1.5 ui-sans-serif,system-ui,"Segoe UI",Roboto,Helvetica,Arial}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:28px 30px;width:320px}
  .brand{font-weight:700;font-size:16px;letter-spacing:.3px;color:#fff;margin-bottom:4px}
  .brand::first-letter{color:var(--accent)}
  .sub{font-size:12px;color:var(--muted);margin-bottom:16px}
  label{display:block;font-size:12px;color:var(--muted);margin:12px 0 4px}
  input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:6px;
    padding:8px 10px;color:var(--text);font:inherit}
  input:focus{outline:none;border-color:var(--accent)}
  button{width:100%;margin-top:18px;background:var(--accent);border:1px solid var(--accent);
    border-radius:6px;padding:8px;color:#06121f;font-weight:600;font:inherit;cursor:pointer}
  button:hover{filter:brightness(1.08)}
  button:disabled{opacity:.6;cursor:wait}
  .err{color:var(--bad);font-size:12px;min-height:16px;margin-top:10px}
</style>
</head>
<body>
<form class="card" id="f">
  <div class="brand">⬢ GPU&nbsp;Visualizer</div>
  <div class="sub">login node 是共享机器,先登录再继续。</div>
  <label for="u">用户名</label>
  <input id="u" name="username" autocomplete="username" autofocus required>
  <label for="p">密码</label>
  <input id="p" name="password" type="password" autocomplete="current-password" required>
  <button id="b" type="submit">登录</button>
  <div class="err" id="e"></div>
</form>
<script>
"use strict";
const f=document.getElementById("f"),e=document.getElementById("e"),b=document.getElementById("b");
f.onsubmit=async ev=>{
  ev.preventDefault(); e.textContent=""; b.disabled=true;
  try{
    const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({username:f.username.value.trim(),password:f.password.value})});
    if(r.ok){ location.replace("/"); return; }
    const j=await r.json().catch(()=>({}));
    e.textContent=j.error||("登录失败 ("+r.status+")");
  }catch(err){ e.textContent=String(err); }
  b.disabled=false;
};
</script>
</body>
</html>
